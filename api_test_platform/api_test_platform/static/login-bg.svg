<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122442"/>
      <stop offset="0.55" stop-color="#1D3A66"/>
      <stop offset="1" stop-color="#2F5CA6"/>
    </linearGradient>
    <radialGradient id="nebulaTop" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3E6FD0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3E6FD0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaBottom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B5FD8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7B5FD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset="0.35" stop-color="#FFE08A"/>
      <stop offset="0.7" stop-color="#FFB84D"/>
      <stop offset="1" stop-color="#F98B2B"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC96B" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FF9E4D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF9E4D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FB8FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8FB8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7FB2FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- 星云氛围光晕（低透明度，增加层次） -->
  <circle cx="210" cy="140" r="330" fill="url(#nebulaTop)"/>
  <circle cx="1030" cy="690" r="380" fill="url(#nebulaBottom)"/>

  <!-- 星空点缀 -->
  <g fill="#FFFFFF">
    <circle cx="96" cy="88" r="1.4" opacity="0.7"/>
    <circle cx="210" cy="46" r="1" opacity="0.5"/>
    <circle cx="330" cy="120" r="1.2" opacity="0.6"/>
    <circle cx="470" cy="52" r="1" opacity="0.45"/>
    <circle cx="1120" cy="90" r="1.5" opacity="0.75"/>
    <circle cx="1030" cy="40" r="1" opacity="0.5"/>
    <circle cx="880" cy="150" r="1.2" opacity="0.55"/>
    <circle cx="150" cy="210" r="1" opacity="0.5"/>
    <circle cx="60" cy="420" r="1.2" opacity="0.55"/>
    <circle cx="1140" cy="380" r="1.1" opacity="0.5"/>
    <circle cx="1180" cy="620" r="1.4" opacity="0.65"/>
    <circle cx="240" cy="700" r="1.2" opacity="0.5"/>
    <circle cx="70" cy="640" r="1" opacity="0.45"/>
    <circle cx="700" cy="60" r="1.1" opacity="0.5"/>
    <circle cx="560" cy="130" r="1" opacity="0.4"/>
    <circle cx="1150" cy="230" r="1" opacity="0.45"/>
    <circle cx="300" cy="760" r="1.1" opacity="0.5"/>
    <circle cx="990" cy="720" r="1.3" opacity="0.6"/>
    <circle cx="840" cy="760" r="1" opacity="0.45"/>
    <circle cx="60" cy="300" r="1" opacity="0.4"/>
    <circle cx="470" cy="180" r="1.1" opacity="0.5"/>
    <circle cx="1080" cy="300" r="1" opacity="0.45"/>
  </g>

  <!-- 流星 -->
  <g stroke="url(#meteor)" stroke-width="2" stroke-linecap="round">
    <line x1="180" y1="80" x2="252" y2="152"/>
    <line x1="1050" y1="210" x2="1108" y2="268" stroke-width="1.6"/>
  </g>

  <!-- 太阳系轨道（同心椭圆，蓝色发光） -->
  <g fill="none">
    <ellipse cx="650" cy="430" rx="120" ry="50"  stroke="rgba(110,170,255,0.16)" stroke-width="3"/>
    <ellipse cx="650" cy="430" rx="120" ry="50"  stroke="rgba(150,195,255,0.42)" stroke-width="1"/>
    <ellipse cx="650" cy="430" rx="170" ry="71"  stroke="rgba(110,170,255,0.16)" stroke-width="3"/>
    <ellipse cx="650" cy="430" rx="170" ry="71"  stroke="rgba(150,195,255,0.42)" stroke-width="1"/>
    <ellipse cx="650" cy="430" rx="225" ry="95"  stroke="rgba(110,170,255,0.16)" stroke-width="3"/>
    <ellipse cx="650" cy="430" rx="225" ry="95"  stroke="rgba(150,195,255,0.42)" stroke-width="1"/>
    <ellipse cx="650" cy="430" rx="280" ry="118" stroke="rgba(110,170,255,0.16)" stroke-width="3"/>
    <ellipse cx="650" cy="430" rx="280" ry="118" stroke="rgba(150,195,255,0.42)" stroke-width="1"/>
    <ellipse cx="650" cy="430" rx="340" ry="143" stroke="rgba(110,170,255,0.16)" stroke-width="3"/>
    <ellipse cx="650" cy="430" rx="340" ry="143" stroke="rgba(150,195,255,0.42)" stroke-width="1"/>
    <ellipse cx="650" cy="430" rx="400" ry="168" stroke="rgba(110,170,255,0.16)" stroke-width="3"/>
    <ellipse cx="650" cy="430" rx="400" ry="168" stroke="rgba(150,195,255,0.42)" stroke-width="1"/>
    <ellipse cx="650" cy="430" rx="460" ry="193" stroke="rgba(110,170,255,0.16)" stroke-width="3"/>
    <ellipse cx="650" cy="430" rx="460" ry="193" stroke="rgba(150,195,255,0.42)" stroke-width="1"/>
    <ellipse cx="650" cy="430" rx="520" ry="218" stroke="rgba(110,170,255,0.16)" stroke-width="3"/>
    <ellipse cx="650" cy="430" rx="520" ry="218" stroke="rgba(150,195,255,0.42)" stroke-width="1"/>
  </g>

  <!-- 太阳（光晕 + 核心） -->
  <circle cx="650" cy="430" r="150" fill="url(#sunGlow)"/>
  <circle cx="650" cy="430" r="52" fill="url(#sunCore)"/>
  <circle cx="650" cy="430" r="66" fill="none" stroke="rgba(255,190,110,0.35)" stroke-width="1.5"/>

  <!-- 行星（光晕 + 本体） -->
  <g>
    <!-- Mercury -->
    <circle cx="742" cy="462" r="16" fill="url(#planetGlow)"/>
    <circle cx="742" cy="462" r="4.5" fill="#C8C9CC"/>
    <!-- Venus -->
    <circle cx="530" cy="480" r="20" fill="url(#planetGlow)"/>
    <circle cx="530" cy="480" r="6.5" fill="#F2C879"/>
    <!-- Earth -->
    <circle cx="795" cy="357" r="22" fill="url(#planetGlow)"/>
    <circle cx="795" cy="357" r="7" fill="#5FA8E8"/>
    <!-- Mars -->
    <circle cx="421" cy="362" r="18" fill="url(#planetGlow)"/>
    <circle cx="421" cy="362" r="5.5" fill="#E2704A"/>
    <!-- Jupiter -->
    <circle cx="620" cy="572" r="30" fill="url(#planetGlow)"/>
    <circle cx="620" cy="572" r="11" fill="#D9A066"/>
    <!-- Saturn（带环） -->
    <circle cx="546" cy="268" r="26" fill="url(#planetGlow)"/>
    <ellipse cx="546" cy="268" rx="19" ry="6.5" fill="none" stroke="#E3C08A" stroke-width="2.4" transform="rotate(-18 546 268)"/>
    <circle cx="546" cy="268" r="9" fill="#E3C08A"/>
    <!-- Uranus -->
    <circle cx="730" cy="620" r="22" fill="url(#planetGlow)"/>
    <circle cx="730" cy="620" r="8" fill="#8FD8E0"/>
    <!-- Neptune -->
    <circle cx="390" cy="619" r="24" fill="url(#planetGlow)"/>
    <circle cx="390" cy="619" r="8.5" fill="#5C7FE8"/>
  </g>

  <!-- 行星名称标注 -->
  <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12.5" font-weight="500" fill="rgba(195,220,255,0.92)" letter-spacing="0.5">
    <text x="756" y="470">Mercury</text>
    <text x="500" y="496">Venus</text>
    <text x="782" y="352" text-anchor="end">Earth</text>
    <text x="398" y="376">Mars</text>
    <text x="636" y="600">Jupiter</text>
    <text x="562" y="256">Saturn</text>
    <text x="742" y="628">Uranus</text>
    <text x="406" y="648">Neptune</text>
  </g>
</svg>
