<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接口测试</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="shell">

  <aside class="rail">
    <div class="rail-brand">
      <span class="brand-mark">◈</span>
      <div class="brand-text">
        <span class="brand-title">接口测试平台</span>
        <span class="brand-sub">Outbound API Console</span>
      </div>
    </div>

    <section class="rail-section">
      <div class="rail-section-head">
        <h2>环境</h2>
        <button class="icon-btn" id="addEnvBtn" title="新增环境">＋</button>
      </div>
      <div id="envList" class="rail-list"></div>
    </section>

    <section class="rail-section">
      <div class="rail-section-head">
        <h2>接口预设</h2>
        <div class="rail-head-actions">
          <button class="ghost-btn mini" id="batchRunBtn" disabled title="勾选多个接口后批量执行（5.0 + 3.0）">批量执行</button>
          <button class="icon-btn" id="addIfaceBtn" title="新增接口">＋</button>
        </div>
      </div>
      <div id="ifaceList" class="rail-list"></div>
    </section>
  </aside>

  <main class="stage">

    <header class="stage-header">
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="single">单环境测试</button>
        <button class="mode-btn" data-mode="compare">双环境对比</button>
      </div>
      <div class="user-area">
        <div class="avatar-btn" id="avatarBtn" title="账号设置">
          <span class="avatar-circle" id="avatarCircle">?</span>
          <span class="avatar-name" id="avatarName"></span>
        </div>
        <a class="logout-btn" href="/logout">退出登录</a>
      </div>
    </header>

    <section class="config-row" id="singleConfig">
      <div class="field">
        <label>接口</label>
        <select id="ifaceSelect"></select>
      </div>
      <div class="field">
        <label>环境</label>
        <select id="envSelect"></select>
      </div>
      <div class="field grow">
        <label>请求地址</label>
        <div class="url-preview" id="urlPreview">—</div>
      </div>
    </section>

    <section class="config-row" id="compareConfig" style="display:none">
      <div class="field">
        <label>接口</label>
        <select id="ifaceSelectC"></select>
      </div>
      <div class="field">
        <label>环境 A</label>
        <select id="envSelectA"></select>
      </div>
      <div class="field">
        <label>环境 B</label>
        <select id="envSelectB"></select>
      </div>
      <button class="ghost-btn config-save-btn" id="saveCompareConfigBtn" title="保存当前双环境对比的整体配置（接口、环境 A/B 与请求体）">保存配置</button>
    </section>

    <section class="editor-block" id="singleEditorBlock">
      <div class="editor-head">
        <span>请求体 request</span>
        <div class="editor-head-actions">
          <button class="ghost-btn" id="saveBodyBtn">保存</button>
          <button class="ghost-btn" id="resetBodyBtn">重置为模板</button>
        </div>
      </div>
      <textarea id="bodyEditor" spellcheck="false"></textarea>
      <p class="hint" id="bodyHint"></p>
    </section>

    <section class="editor-grid" id="compareEditorBlock" style="display:none">
      <div class="editor-block">
        <div class="editor-head">
          <span>请求体 request A<em class="editor-env" id="envALabel"></em></span>
          <div class="editor-head-actions">
            <button class="ghost-btn" id="saveBodyBtnA">保存</button>
            <button class="ghost-btn" id="resetBodyBtnA">重置为模板</button>
          </div>
        </div>
        <textarea id="bodyEditorA" spellcheck="false"></textarea>
        <p class="hint" id="bodyHintA"></p>
      </div>
      <div class="editor-block">
        <div class="editor-head">
          <span>请求体 request B<em class="editor-env" id="envBLabel"></em></span>
          <div class="editor-head-actions">
            <button class="ghost-btn" id="saveBodyBtnB">保存</button>
            <button class="ghost-btn" id="resetBodyBtnB">重置为模板</button>
          </div>
        </div>
        <textarea id="bodyEditorB" spellcheck="false"></textarea>
        <p class="hint" id="bodyHintB"></p>
      </div>
    </section>

    <div class="action-row">
      <button class="fire-btn" id="fireBtn">▶ 发送请求</button>
      <span class="status-line" id="statusLine"></span>
    </div>

    <section class="history-block">
      <div class="editor-head">
        <span>历史记录</span>
        <button class="ghost-btn" id="clearHistoryBtn">清空</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>

  </main>

  <main class="stage response-stage">

    <div class="batch-panel" id="batchPanel" style="display:none">
      <div class="batch-head">
        <span>批量执行 <em class="editor-env" id="batchEnvInfo"></em></span>
        <button class="ghost-btn" id="closeBatchBtn">关闭</button>
      </div>
      <div class="batch-progress">
        <span class="batch-progress-text" id="batchProgressText">正在执行 0/0</span>
        <div class="batch-bar"><div class="batch-bar-fill" id="batchBarFill"></div></div>
      </div>
      <div class="batch-overview" id="batchOverview"></div>
      <div class="batch-table-wrap">
        <table class="batch-table">
          <thead>
            <tr><th>状态</th><th>接口名称</th><th id="batchThA">5.0环境</th><th id="batchThB">3.0环境</th><th>响应差异</th><th>操作</th></tr>
          </thead>
          <tbody id="batchTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="response-panel" id="responsePanel">
      <div class="response-head">
        <span>响应 Response</span>
        <div class="response-actions">
          <button class="ghost-btn" id="formatResultBtn">格式化</button>
        </div>
      </div>
      <div class="response-grid" id="responseGrid">
        <div class="response-empty" id="responseEmpty">等待发送请求…</div>
      </div>
      <div class="field-compare" id="fieldCompare" style="display:none">
        <div class="field-compare-head">字段对比（类型 & 缺失）</div>
        <div class="field-compare-body" id="fieldCompareBody"></div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="modal-overlay" id="detailOverlay">
  <div class="modal modal-xl" id="detailModalBody"></div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="userDrawer">
  <div class="drawer-head">
    <span>账号设置</span>
    <button class="icon-btn" id="drawerCloseBtn" title="关闭">✕</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-avatar">
      <span class="avatar-circle big" id="drawerAvatar">?</span>
    </div>
    <button class="ghost-btn drawer-avatar-btn" id="changeAvatarBtn">修改头像</button>
    <input type="file" id="avatarFileInput" accept="image/*" style="display:none">
    <div class="field">
      <label>用户名</label>
      <input id="drawerUsername" readonly>
    </div>
    <div class="field">
      <label>密码（可直接修改）</label>
      <input id="drawerPassword" type="text" autocomplete="off">
    </div>
    <p class="hint" id="drawerHint"></p>
    <button class="fire-btn drawer-save" id="drawerSaveBtn">保存</button>
  </div>
</aside>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
